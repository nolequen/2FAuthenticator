name: Bug Report
description: Report a bug in 2FAuthenticator
labels:
  - bug
  - unconfirmed
body:
  - type: textarea
    attributes:
      label: Describe the issue
      description: Include detailed steps to reproduce the issue if appropriate.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Other
    validations:
      required: true
  - type: input
    attributes:
      label: Browser Version
    validations:
      required: true
  - type: input
    attributes:
      label: Extension Version
      description: The extension version is found by clicking the cog at the top left and looking at the bottom of the page.
    validations:
      required: true
